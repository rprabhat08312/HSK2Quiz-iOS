name: HSK2Quiz
options:
  bundleIdPrefix: com.hsk2
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_LDFLAGS: "$(inherited) -Xlinker -weak_library -Xlinker /usr/lib/swift/libswift_Concurrency.dylib"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) /usr/lib/swift @executable_path/Frameworks"
targets:
  HSK2Quiz:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "evobc"
        buildPhase: resources
      - path: Resources/evobc
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "HSK 2 Quiz"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsk2.quiz
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
